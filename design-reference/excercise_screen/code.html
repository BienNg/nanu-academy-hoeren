<!-- Quick German Special Character Accessory Bar -->
<div class="pt-space-8">

<button class="flex-1 min-w-[36px] h-10 bg-surface-container text-on-surface font-label-md text-label-md rounded-xl active:bg-primary active:text-on-primary transition-colors flex items-center justify-center" onclick="insertGermanChar('ä')" type="button">ä</button>
<button class="flex-1 min-w-[36px] h-10 bg-surface-container text-on-surface font-label-md text-label-md rounded-xl active:bg-primary active:text-on-primary transition-colors flex items-center justify-center" onclick="insertGermanChar('ö')" type="button">ö</button>

<button class="flex-1 min-w-[36px] h-10 bg-surface-container text-on-surface font-label-md text-label-md rounded-xl active:bg-primary active:text-on-primary transition-colors flex items-center justify-center" onclick="insertGermanChar('Ä')" type="button">Ä</button>
<button class="flex-1 min-w-[36px] h-10 bg-surface-container text-on-surface font-label-md text-label-md rounded-xl active:bg-primary active:text-on-primary transition-colors flex items-center justify-center" onclick="insertGermanChar('Ö')" type="button">Ö</button>

<script>
  function insertGermanChar(char) {
    const textarea = document.getElementById('dictation-input');
    if (!textarea) return;
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const text = textarea.value;
    textarea.value = text.substring(0, start) + char + text.substring(end);
    textarea.focus();
    textarea.selectionStart = textarea.selectionEnd = start + char.length;
    updateCounts();
  }

  function updateCounts() {
    const textarea = document.getElementById('dictation-input');
    const counter = document.getElementById('char-word-count');
    if (!textarea || !counter) return;
    const text = textarea.value.trim();
    const words = text ? text.split(/\s+/).length : 0;
    const chars = textarea.value.length;
    counter.textContent = `${words} từ · ${chars} ký tự`;
  }

  const inputElem = document.getElementById('dictation-input');
  if (inputElem) {
    inputElem.addEventListener('input', updateCounts);
  }

  const speedToggle = document.getElementById('speed-toggle');
  if (speedToggle) {
    speedToggle.addEventListener('click', () => {
      speedToggle.textContent = speedToggle.textContent.trim() === '0.8x' ? '1.0x' : '0.8x';
    });
  }

  const hintToggle = document.getElementById('hint-toggle');
  const hintCard = document.getElementById('hint-card');
  if (hintToggle && hintCard) {
    hintToggle.addEventListener('click', () => {
      hintCard.classList.toggle('hidden');
    });
  }

  const playBtn = document.getElementById('play-pause-btn');
  if (playBtn) {
    playBtn.addEventListener('click', () => {
      const icon = playBtn.querySelector('.material-symbols-outlined');
      if (icon) {
        icon.textContent = icon.textContent === 'pause' ? 'play_arrow' : 'pause';
      }
    });
  }
</script></main>
